services:
  # Public HTTP/HTTPS reverse proxy. Use this as the VM web entrypoint.
  web-proxy:
    image: caddy:2-alpine
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-}
    networks:
      - web
    ports:
      - "${HTTP_HOST_PORT:-80}:80"
      - "${HTTPS_HOST_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-config:
  caddy-data:

networks:
  web:
    external: true
    name: vm-web
